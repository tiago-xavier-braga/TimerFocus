name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run dist

      - uses: actions/upload-artifact@v5
        with:
          name: timer-focus-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
