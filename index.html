<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>Timer Focus</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header class="toolbar">
      <button id="report" class="icon-btn" title="Today's report" aria-pressed="false">
        <svg viewBox="0 0 24 24"><path d="M5 20v-7M12 20V5M19 20v-10"/></svg>
      </button>
      <button id="pin" class="icon-btn" title="Always on top" aria-pressed="false">
        <svg viewBox="0 0 24 24"><path d="M8.5 3.5h7M10 3.5V9l-3.5 3.5v3h11v-3L14 9V3.5M12 15.5V21"/></svg>
      </button>
      <button id="theme" class="icon-btn" title="Toggle theme">
        <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
      </button>
    </header>

    <main class="timer">
      <div class="dial">
        <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
          <circle class="ring-track" cx="100" cy="100" r="90" />
          <g id="ring-spin">
            <circle id="ring-arc" class="ring-arc" cx="100" cy="100" r="90" />
          </g>
        </svg>
        <div class="readout">
          <div id="time" class="time">00:00:00</div>
          <div id="active-task" class="active-task"></div>
        </div>
      </div>

      <div class="controls">
        <button id="reset" class="ctrl" title="Reset">
          <svg viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3L4.5 9"/><path d="M4.5 4.5V9H9"/></svg>
        </button>
        <button id="play" class="ctrl primary" title="Play">
          <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg>
        </button>
      </div>
    </main>

    <section id="report-view" class="report" hidden></section>

    <section id="todo" class="todo">
      <form id="add-form" class="add">
        <button id="add-color" type="button" class="dot" title="Tag color"></button>
        <input id="add-name" type="text" placeholder="New task…" maxlength="80" autocomplete="off" />
      </form>
      <ul id="tasks" class="tasks"></ul>
    </section>

    <dialog id="modal" class="modal">
      <form method="dialog">
        <p id="modal-title" class="modal-title"></p>
        <p id="modal-text" class="modal-text"></p>
        <div class="modal-actions">
          <button value="cancel" class="btn">Cancel</button>
          <button value="ok" class="btn primary">Confirm</button>
        </div>
      </form>
    </dialog>

    <dialog id="edit" class="modal">
      <form method="dialog">
        <p class="modal-title">Edit task</p>
        <label class="field">Name<input id="edit-name" type="text" maxlength="80" required autocomplete="off" /></label>
        <label class="field">Hours tracked<input id="edit-hours" type="number" min="0" step="any" required /></label>
        <div class="modal-actions">
          <button id="edit-cancel" type="button" class="btn">Cancel</button>
          <button value="ok" class="btn primary">Save</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
